<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Thief Simulator — Hub</title>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.158.0",
    "three/addons/": "https://esm.sh/three@0.158.0/examples/jsm/"
  }
}
</script>

<style>
/* ── Base ───────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }

/* ── Pointer-lock overlay ───────────────────────────────── */
#pointer-lock-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.82);
  color: #ccc; font-family: 'Courier New', monospace;
  text-align: center; gap: 18px;
  cursor: pointer;
}
#pointer-lock-overlay h1 { font-size: clamp(22px,4vw,38px); color: #00ff88; letter-spacing: 3px; }
#pointer-lock-overlay p  { font-size: clamp(13px,2vw,17px); color: #aaa; }
#pointer-lock-overlay .hint { font-size: 12px; color: #555; margin-top: 8px; }

/* ── Crosshair ──────────────────────────────────────────── */
#crosshair {
  position: fixed; top: 50%; left: 50%;
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.75);
  transform: translate(-50%, -50%);
  pointer-events: none; z-index: 10;
  box-shadow: 0 0 4px rgba(0,0,0,0.8);
}

/* ── Interaction prompt ─────────────────────────────────── */
#interaction-prompt {
  position: fixed; top: calc(50% + 24px); left: 50%;
  transform: translateX(-50%);
  color: #fff; font-family: 'Courier New', monospace; font-size: 13px;
  background: rgba(0,0,0,0.65);
  padding: 5px 14px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none; z-index: 10;
  white-space: nowrap;
}

/* ── Computer / Heist menu ──────────────────────────────── */
#computer-menu {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0, 8, 4, 0.94);
  font-family: 'Courier New', monospace;
  color: #00ff88;
}
#computer-menu h2 {
  font-size: clamp(18px,3vw,28px); letter-spacing: 4px;
  margin-bottom: 8px; text-transform: uppercase;
}
#computer-menu .subtitle {
  font-size: 12px; color: #447755; margin-bottom: 32px;
  letter-spacing: 2px;
}
#heist-cards {
  display: flex; flex-wrap: wrap; gap: 20px;
  justify-content: center; max-width: 760px; padding: 0 16px;
}
.heist-card {
  background: rgba(0,255,136,0.04);
  border: 1px solid rgba(0,255,136,0.25);
  border-radius: 8px; padding: 20px 24px;
  width: 210px; text-align: left;
  transition: border-color 0.2s, background 0.2s;
}
.heist-card:hover {
  border-color: rgba(0,255,136,0.6);
  background: rgba(0,255,136,0.08);
}
.heist-card .card-name { font-size: 14px; margin-bottom: 10px; color: #00ff88; }
.heist-card .card-diff { font-size: 11px; color: #666; margin-bottom: 4px; }
.heist-card .card-diff span { color: #aaa; }
.heist-card .card-reward { font-size: 11px; color: #666; margin-bottom: 14px; }
.heist-card .card-reward span { color: #ffcc44; }
.btn-select {
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.3);
  color: #00ff88; font-family: inherit;
  font-size: 11px; padding: 6px 14px;
  border-radius: 3px; cursor: not-allowed;
  opacity: 0.5; letter-spacing: 1px;
}
#btn-close-menu {
  margin-top: 32px;
  background: transparent;
  border: 1px solid rgba(0,255,136,0.3);
  color: #00ff88; font-family: inherit;
  font-size: 13px; padding: 10px 32px;
  border-radius: 4px; cursor: pointer;
  letter-spacing: 2px; transition: all 0.2s;
}
#btn-close-menu:hover { background: rgba(0,255,136,0.12); }

/* ── Mobile UI ──────────────────────────────────────────── */
#mobile-ui { display: none; }

#joystick-zone {
  position: fixed; bottom: 28px; left: 28px;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.18);
  touch-action: none; z-index: 20;
}
#joystick-knob {
  position: absolute; top: 50%; left: 50%;
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.4);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

#btn-interact {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%);
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.5); font-family: 'Courier New', monospace;
  font-size: 10px; letter-spacing: 1px;
  cursor: pointer; touch-action: none;
  transition: all 0.2s; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
#btn-interact.active {
  background: rgba(0,255,136,0.18);
  border-color: rgba(0,255,136,0.7);
  color: #00ff88;
  box-shadow: 0 0 18px rgba(0,255,136,0.4);
}

#btn-flashlight {
  position: fixed; bottom: 28px; right: 28px;
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.6); font-family: 'Courier New', monospace;
  font-size: 9px; letter-spacing: 0.5px;
  cursor: pointer; touch-action: none;
  transition: all 0.2s; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
#btn-flashlight.on {
  background: rgba(200,220,255,0.18);
  border-color: rgba(200,220,255,0.7);
  color: #cce0ff;
  box-shadow: 0 0 14px rgba(150,190,255,0.5);
}

/* ── Mobile overrides ───────────────────────────────────── */
@media (pointer: coarse) {
  #crosshair { width: 10px; height: 10px; }
  #interaction-prompt { font-size: 15px; padding: 7px 18px; top: calc(50% + 30px); }
  /* Larger safe area for bottom buttons */
  #joystick-zone  { bottom: max(28px, env(safe-area-inset-bottom, 0px) + 16px); }
  #btn-interact   { bottom: max(28px, env(safe-area-inset-bottom, 0px) + 16px); }
  #btn-flashlight { bottom: max(28px, env(safe-area-inset-bottom, 0px) + 16px); }
}
</style>
</head>

<body>

<!-- Pointer-lock start screen (desktop only; hidden immediately on mobile) -->
<div id="pointer-lock-overlay">
  <h1>THIEF SIMULATOR</h1>
  <p id="overlay-text">Click anywhere to enter the hideout</p>
  <div class="hint" id="overlay-hint">WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; E — Interact &nbsp;|&nbsp; F — Flashlight</div>
</div>

<!-- HUD -->
<div id="crosshair"></div>
<div id="interaction-prompt"></div>

<!-- Heist selection menu (shown when using computer) -->
<div id="computer-menu">
  <h2>Select Target</h2>
  <div class="subtitle">// NEXT OPERATION //</div>
  <div id="heist-cards"></div>
  <button id="btn-close-menu">[ CLOSE TERMINAL ]</button>
</div>

<!-- Mobile controls -->
<div id="mobile-ui">
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>
  <button id="btn-interact">USE</button>
  <button id="btn-flashlight">LIGHT</button>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Detect mobile first — used throughout all sections
const isMobile = navigator.maxTouchPoints > 1 || /Mobi|Android/i.test(navigator.userAgent);

/* ═══════════════════════════════════════════════════════════
   SECTION 1 — Constants & Config
═══════════════════════════════════════════════════════════ */

const CFG = {
  room:         { w: 10, h: 3.5, d: 10 },
  playerHeight: 1.7,
  sitHeight:    1.05,
  moveSpeed:    3.2,
  lookSensitivity: 0.002,
  touchLookSens:   0.004,
  interactDist:    2.5,
  joystickRadius:  42,
  tweenDuration:   0.55,
  handBobSpeed:    8.0,
  handBobAmt:      0.012,
};

const STATE = { EXPLORING: 'EXPLORING', SITTING: 'SITTING', MENU: 'MENU' };

/* ═══════════════════════════════════════════════════════════
   SECTION 2 — Scene Setup
═══════════════════════════════════════════════════════════ */

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = !isMobile; // shadows are expensive on mobile GPUs
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.LinearToneMapping;
renderer.toneMappingExposure = 1.6;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// No fog — indoor room, fog was making everything black

// Camera rig: playerRig holds position+yaw; camera holds pitch
const playerRig = new THREE.Object3D();
playerRig.position.set(0, CFG.playerHeight, 2.0);
scene.add(playerRig);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 50);
playerRig.add(camera);

// Lights — single warm bulb atmosphere
const ambientLight = new THREE.AmbientLight(0xffd080, 0.9);
scene.add(ambientLight);

// Main room light — bare hanging bulb
const roomBulbLight = new THREE.PointLight(0xffcc77, 15.0, 20, 1.0);
roomBulbLight.position.set(-1.0, 2.68, -0.5);
roomBulbLight.castShadow = !isMobile;
if (!isMobile) roomBulbLight.shadow.mapSize.set(256, 256);
scene.add(roomBulbLight);

// Soft fill light — warms up corners the bulb doesn't reach
const fillLight = new THREE.PointLight(0xff9944, 2.5, 14, 1.5);
fillLight.position.set(2.5, 2.0, -2.0);
scene.add(fillLight);


// Flashlight (child of camera so it moves with view)
const flashlight = new THREE.SpotLight(0xccddff, 0, 14, Math.PI / 10, 0.35, 2);
flashlight.position.set(0, 0, -0.1);
flashlight.castShadow = false;
const flashlightTarget = new THREE.Object3D();
flashlightTarget.position.set(0, 0, -1);
camera.add(flashlightTarget);
flashlight.target = flashlightTarget;
camera.add(flashlight);
let flashlightOn = false;

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (typeof joystickRect !== 'undefined') joystickRect = joystickZone.getBoundingClientRect();
});

/* ═══════════════════════════════════════════════════════════
   SECTION 3 — World Builder (modest apartment)
═══════════════════════════════════════════════════════════ */

// Material factory
function mat(color, roughness = 0.85, metalness = 0.05, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...opts });
}

// Add a box mesh to any parent (scene or group)
function addBox(parent, w, h, d, x, y, z, material, shadow = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  if (shadow) { mesh.castShadow = true; mesh.receiveShadow = true; }
  parent.add(mesh);
  return mesh;
}

// Add a box to a Group (always casts/receives shadow)
function groupBox(group, w, h, d, x, y, z, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  return m;
}

// AABB collision registry (XZ plane; player Y handled separately)
const colliders = [];
function addCollider(minX, maxX, minZ, maxZ) {
  colliders.push({ minX, maxX, minZ, maxZ });
}

// ── Palette ──────────────────────────────────────────────────
const floorMat  = mat(0x2a1c0e, 0.88, 0.0);  // dark wood planks
const wallMat   = mat(0x3d3020, 0.85, 0.0);  // dirty warm plaster
const ceilMat   = mat(0x2e2818, 0.90, 0.0);  // yellowed ceiling
const trimMat   = mat(0x1a1208, 0.9,  0.05); // skirting board
const deskMat   = mat(0x1e1408, 0.82, 0.05);
const legMat    = mat(0x111008, 0.9,  0.1);
const doorWood  = mat(0x1e1410, 0.85, 0.05);
const frameMat  = mat(0x161008, 0.82, 0.08);

// ── Floor ───────────────────────────────────────────────────
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ── Ceiling ─────────────────────────────────────────────────
addBox(scene, 10.2, 0.1, 10.2, 0, 3.55, 0, ceilMat, false);

// ── Walls ───────────────────────────────────────────────────
addBox(scene, 10, 3.5, 0.12,  0, 1.75, -5,  wallMat, false); // back
addBox(scene, 0.12, 3.5, 10, -5, 1.75,  0,  wallMat, false); // left
addBox(scene, 0.12, 3.5, 10,  5, 1.75,  0,  wallMat, false); // right

// Front wall with door gap (X = 1.4 → 3.6, H = 0 → 2.2)
addBox(scene, 6.4, 3.5, 0.12, -1.8, 1.75, 5, wallMat, false); // left section
addBox(scene, 1.4, 3.5, 0.12, 4.3,  1.75, 5, wallMat, false); // right section
addBox(scene, 2.2, 1.3, 0.12, 2.5,  2.85, 5, wallMat, false); // above door

// ── Door frame ───────────────────────────────────────────────
addBox(scene, 0.14, 2.28, 0.15, 1.43, 1.14, 4.94, frameMat); // left post
addBox(scene, 0.14, 2.28, 0.15, 3.57, 1.14, 4.94, frameMat); // right post
addBox(scene, 2.28, 0.14, 0.15, 2.5,  2.21, 4.94, frameMat); // top beam

// ── Door panel ───────────────────────────────────────────────
addBox(scene, 2.0, 2.2, 0.07, 2.5, 1.1, 4.87, doorWood);
// Panel inset details
addBox(scene, 1.6, 0.88, 0.04, 2.5, 1.56, 4.84, mat(0x181210, 0.9, 0));
addBox(scene, 1.6, 0.82, 0.04, 2.5, 0.52, 4.84, mat(0x181210, 0.9, 0));
// Door knob
addBox(scene, 0.06, 0.06, 0.1, 1.68, 1.1, 4.82, mat(0x3a2818, 0.3, 0.7));
addCollider(1.38, 3.62, 4.72, 5.2); // door blocks passage

// ── Skirting boards ──────────────────────────────────────────
addBox(scene, 10, 0.1, 0.05,  0,    0.05, -4.97, trimMat, false);
addBox(scene, 10, 0.1, 0.05,  0,    0.05,  4.97, trimMat, false);
addBox(scene, 0.05, 0.1, 10, -4.97, 0.05,  0,    trimMat, false);
addBox(scene, 0.05, 0.1, 10,  4.97, 0.05,  0,    trimMat, false);

// ── Boarded window (right wall X=5, center Z=-1.5) ───────────
// Recess back panel
addBox(scene, 0.05, 0.9, 1.1, 4.93, 1.65, -1.5, mat(0x080606, 0.98, 0), false);
// Frame
addBox(scene, 0.15, 0.9, 0.1, 4.93, 1.65, -0.94, frameMat, false); // near side
addBox(scene, 0.15, 0.9, 0.1, 4.93, 1.65, -2.06, frameMat, false); // far side
addBox(scene, 0.15, 0.1, 1.1, 4.93, 2.12, -1.5,  frameMat, false); // top
addBox(scene, 0.15, 0.1, 1.1, 4.93, 1.18, -1.5,  frameMat, false); // bottom
// Boards nailed across
const boardMat = mat(0x2a1c0c, 0.9, 0.04);
const b1 = addBox(scene, 0.09, 0.09, 1.22, 4.88, 1.9,  -1.5, boardMat);
b1.rotation.z = 0.18;
const b2 = addBox(scene, 0.09, 0.09, 1.22, 4.88, 1.6,  -1.5, boardMat);
const b3 = addBox(scene, 0.09, 0.09, 1.22, 4.88, 1.32, -1.5, boardMat);
b3.rotation.z = -0.14;
// Emissive light leak behind boards (cold outside light seeping through gaps)
addBox(scene, 0.02, 0.78, 0.95, 4.94, 1.65, -1.5,
  mat(0x050408, 0.98, 0, { emissive: 0x2233bb, emissiveIntensity: 0.12 }), false);
// Window leak point light
// windowLeak light removed — boards block view, emissive handles the effect

// ── Hanging lamp (visual) ─────────────────────────────────────
// Ceiling rose
addBox(scene, 0.12, 0.04, 0.12, -1, 3.51, -0.5, mat(0x1e1c14, 0.9, 0.1), false);
// Cord
addBox(scene, 0.016, 0.75, 0.016, -1, 3.13, -0.5, mat(0x111111, 0.9, 0.2), false);
// Socket
addBox(scene, 0.09, 0.08, 0.09, -1, 2.74, -0.5, mat(0x1a1208, 0.7, 0.3));
// Bulb — emissive warm glow
addBox(scene, 0.075, 0.1, 0.075, -1, 2.67, -0.5,
  mat(0x5a3010, 0.2, 0.1, { emissive: 0xffaa44, emissiveIntensity: 3.0 }));

// ── Desk (left wall, near front — "PC near the door") ─────────
addBox(scene, 1.65, 0.06, 0.82, -3.7, 0.76, 4.05, deskMat);   // surface
addBox(scene, 1.63, 0.04, 0.80, -3.7, 0.43, 4.05, deskMat);   // mid shelf
[[-4.5, 3.66], [-4.5, 4.44], [-2.92, 3.66], [-2.92, 4.44]].forEach(([x, z]) => {
  addBox(scene, 0.06, 0.76, 0.06, x, 0.38, z, legMat);
});
addCollider(-4.62, -2.78, 3.64, 4.52); // desk collision

// ── Chair ────────────────────────────────────────────────────
const chairMat = mat(0x0e0e0e, 0.88, 0.12);
const chairGroup = new THREE.Group();
chairGroup.name = 'chair';

groupBox(chairGroup, 0.5,  0.06, 0.5,  0,     0,     0,     chairMat);          // seat
groupBox(chairGroup, 0.5,  0.6,  0.06, 0,     0.33, -0.22,  chairMat);          // back
groupBox(chairGroup, 0.5,  0.04, 0.04, 0,     0.63, -0.22,  mat(0x1c1c1c,0.7,0.3)); // top rail
[[-0.21, 0.21],[0.21, 0.21],[-0.21,-0.21],[0.21,-0.21]].forEach(([lx,lz]) => {
  groupBox(chairGroup, 0.04, 0.46, 0.04, lx, -0.23, lz, legMat);
});
groupBox(chairGroup, 0.04, 0.16, 0.44, -0.27, 0.17, 0, chairMat); // armrests
groupBox(chairGroup, 0.04, 0.16, 0.44,  0.27, 0.17, 0, chairMat);

chairGroup.position.set(-3.7, 0.48, 3.2);
scene.add(chairGroup);
addCollider(-4.22, -3.18, 2.7, 3.72); // chair collision

// ── Computer (monitor on desk, tower on floor) ────────────────
const computerGroup = new THREE.Group();
computerGroup.name = 'computer';

groupBox(computerGroup, 0.28, 0.03, 0.18, 0, 0,    0,     mat(0x111111, 0.7, 0.5)); // base
groupBox(computerGroup, 0.03, 0.28, 0.03, 0, 0.15, 0,     mat(0x111111, 0.6, 0.5)); // stand
groupBox(computerGroup, 0.8,  0.5,  0.05, 0, 0.42, 0,     mat(0x0d0d0d, 0.6, 0.3)); // bezel
// Screen faces -Z (toward player at lower Z)
const screenMesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.42, 0.01),
  mat(0x001a0d, 0.3, 0, { emissive: 0x00ff88, emissiveIntensity: 0.55 }));
screenMesh.position.set(0, 0.42, -0.025);
computerGroup.add(screenMesh);

// Screen (local Z=-0.025) ends up at world Z≈3.915, facing the chair at Z=3.2.
// Player sits at Z=3.5 with yaw=Math.PI (looks toward +Z), so sees screen at Z=3.915. ✓
computerGroup.position.set(-3.7, 0.76, 3.94);
scene.add(computerGroup);

// PC tower on floor beside desk
const towerGroup = new THREE.Group();
groupBox(towerGroup, 0.2, 0.42, 0.35, 0, 0.21, 0, mat(0x111111, 0.7, 0.2));
groupBox(towerGroup, 0.18, 0.005, 0.33, 0, 0.42, 0, mat(0x1e1e1e, 0.5, 0.4));
const towerLed = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.014, 0.006),
  mat(0x001100, 0.3, 0, { emissive: 0x00ff44, emissiveIntensity: 1.5 }));
towerLed.position.set(-0.06, 0.32, 0.178);
towerGroup.add(towerLed);
towerGroup.position.set(-4.5, 0, 3.95);
scene.add(towerGroup);

// Screen soft glow point light
// screenGlow light removed — screen emissive material is sufficient

// ── Mattress (back-right corner, on floor) ────────────────────
addBox(scene, 1.9, 0.18, 1.15, 3.0, 0.09, -3.7,
  mat(0x2e2018, 0.95, 0));                                         // mattress body
// Seam lines (stitching detail)
[-3.35, -3.7, -4.05].forEach(z =>
  addBox(scene, 1.88, 0.005, 0.006, 3.0, 0.182, z, mat(0x382820, 0.98, 0), false));
addCollider(2.0, 4.0, -4.35, -3.1); // mattress blocks

// Pillow
addBox(scene, 0.65, 0.13, 0.38, 3.05, 0.25, -3.18, mat(0x2a1e16, 0.9, 0));

// Crumpled blanket
const blanket = addBox(scene, 1.45, 0.16, 0.75, 2.9, 0.26, -3.88, mat(0x1a2a1e, 0.95, 0));
blanket.rotation.y = 0.18;

// ── Nightstand beside mattress ────────────────────────────────
addBox(scene, 0.42, 0.42, 0.42, 4.05, 0.21, -3.22, mat(0x1a1208, 0.88, 0.05));
addCollider(3.82, 4.28, -3.45, -2.99);
// Ashtray + cigarette butt on top
addBox(scene, 0.12, 0.025, 0.12, 4.05, 0.435, -3.22, mat(0x222222, 0.6, 0.3));

// ── Register interactive objects ────────────────────────────
// (populated in Section 7)

// ── Static geometry merge (reduces ~95 draw calls → ~15) ────
// Must run AFTER all scene objects are added but BEFORE the loop.
// Interactive groups and hand are excluded so raycasting still works.
function isDescendant(obj, ancestor) {
  let cur = obj.parent;
  while (cur) { if (cur === ancestor) return true; cur = cur.parent; }
  return false;
}

function mergeStaticScene() {
  scene.updateMatrixWorld(true);
  const byMat = new Map();
  const EXCLUDE = [chairGroup, computerGroup, towerGroup, handGroup];

  scene.traverse(obj => {
    if (!obj.isMesh) return;
    if (obj === screenMesh) return; // keep screen for emissive + interaction
    for (const g of EXCLUDE) if (obj === g || isDescendant(obj, g)) return;

    const key = obj.material.uuid;
    if (!byMat.has(key)) byMat.set(key, { mat: obj.material, list: [] });
    byMat.get(key).list.push(obj);
  });

  for (const { mat, list } of byMat.values()) {
    if (list.length < 2) continue;
    const geos = list.map(o => {
      const g = o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      return g;
    });
    const merged = mergeGeometries(geos, false);
    if (!merged) { geos.forEach(g => g.dispose()); continue; }
    const mesh = new THREE.Mesh(merged, mat);
    mesh.receiveShadow = true; mesh.castShadow = true;
    scene.add(mesh);
    list.forEach(o => { o.removeFromParent(); o.geometry.dispose(); });
    geos.forEach(g => g.dispose());
  }
}

/* ═══════════════════════════════════════════════════════════
   SECTION 5 — Input Manager
═══════════════════════════════════════════════════════════ */

const keys = new Set();
let isPointerLocked = false;
let gameState = STATE.EXPLORING;

// ── Pointer Lock ────────────────────────────────────────────
const canvas = renderer.domElement;
const lockOverlay = document.getElementById('pointer-lock-overlay');

function requestLock() {
  if (gameState === STATE.MENU) return;
  if (isMobile) { lockOverlay.style.display = 'none'; return; }
  canvas.requestPointerLock();
}
lockOverlay.addEventListener('click', requestLock);
canvas.addEventListener('click', () => { if (!isPointerLocked && gameState !== STATE.MENU) requestLock(); });

document.addEventListener('pointerlockchange', () => {
  if (isMobile) return;
  isPointerLocked = document.pointerLockElement === canvas;
  lockOverlay.style.display = (isPointerLocked || gameState === STATE.MENU) ? 'none' : 'flex';
});

document.addEventListener('mousemove', e => {
  if (!isPointerLocked || gameState === STATE.MENU || tweenState.active) return;
  playerRig.rotation.y -= e.movementX * CFG.lookSensitivity;
  camera.rotation.x = clamp(camera.rotation.x - e.movementY * CFG.lookSensitivity, -Math.PI / 2.1, Math.PI / 2.1);
});

// ── Keyboard ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyE') interact();
  if (e.code === 'KeyF') toggleFlashlight();
  if (e.code === 'Escape' && gameState === STATE.MENU) closeComputerMenu();
});
document.addEventListener('keyup', e => keys.delete(e.code));

/* ═══════════════════════════════════════════════════════════
   SECTION 6 — Mobile UI
═══════════════════════════════════════════════════════════ */

if (isMobile) {
  document.getElementById('mobile-ui').style.display = 'block';
  lockOverlay.style.display = 'none'; // no pointer-lock on mobile — dismiss immediately
}

// Joystick
let joystickActive  = false;
let joystickTouchId = null;
const joystickDelta = { x: 0, y: 0 };
const joystickZone  = document.getElementById('joystick-zone');
const joystickKnob  = document.getElementById('joystick-knob');
let joystickRect = joystickZone.getBoundingClientRect(); // cached — updated on resize

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickTouchId = t.identifier;
  joystickActive  = true;
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joystickTouchId) continue;
    const rect = joystickRect;
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > CFG.joystickRadius) {
      const a = Math.atan2(dy, dx);
      dx = Math.cos(a) * CFG.joystickRadius;
      dy = Math.sin(a) * CFG.joystickRadius;
    }
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystickDelta.x = dx / CFG.joystickRadius;
    joystickDelta.y = dy / CFG.joystickRadius;
  }
}, { passive: false });

const joystickEnd = e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joystickTouchId) continue;
    joystickActive  = false;
    joystickTouchId = null;
    joystickDelta.x = 0; joystickDelta.y = 0;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
  }
};
joystickZone.addEventListener('touchend',    joystickEnd, { passive: false });
joystickZone.addEventListener('touchcancel', joystickEnd, { passive: false });

// Touch-drag look (right portion of screen)
let lookTouchId  = null;
let lookLast     = { x: 0, y: 0 };

document.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.closest('#mobile-ui')) continue; // don't hijack button taps as look-drag
    if (t.clientX > window.innerWidth * 0.38 && gameState !== STATE.MENU) {
      lookTouchId = t.identifier;
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: true });

document.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== lookTouchId || gameState === STATE.MENU || tweenState.active) continue;
    const dx = t.clientX - lookLast.x;
    const dy = t.clientY - lookLast.y;
    playerRig.rotation.y -= dx * CFG.touchLookSens;
    camera.rotation.x = clamp(camera.rotation.x - dy * CFG.touchLookSens, -Math.PI / 2.1, Math.PI / 2.1);
    lookLast = { x: t.clientX, y: t.clientY };
  }
}, { passive: true });

document.addEventListener('touchend',    e => { for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null; }, { passive: true });
document.addEventListener('touchcancel', e => { for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null; }, { passive: true });

// Interact / flashlight buttons
document.getElementById('btn-interact').addEventListener('touchstart', e => { e.preventDefault(); interact(); }, { passive: false });
document.getElementById('btn-flashlight').addEventListener('touchstart', e => { e.preventDefault(); toggleFlashlight(); }, { passive: false });

/* ═══════════════════════════════════════════════════════════
   SECTION 7 — Interaction System
═══════════════════════════════════════════════════════════ */

// Registry: uuid → { mesh, tag, label, cooldown }
const interactiveRegistry = new Map();
let currentTarget = null;

const interactionPrompt = document.getElementById('interaction-prompt');
const btnInteract       = document.getElementById('btn-interact');

function registerInteractive(group, tag, label) {
  // Register every descendant mesh; walk up to group when hit
  group.traverse(o => {
    if (o.isMesh) {
      interactiveRegistry.set(o.uuid, { mesh: group, tag, label, cooldown: false });
    }
  });
  // Also register the group itself as a fallback
  interactiveRegistry.set(group.uuid, { mesh: group, tag, label, cooldown: false });
}

// Chair triggers the full sit-down → computer flow in one action
registerInteractive(chairGroup,    'chair',    isMobile ? 'Use Computer' : 'E — Use Computer');
// Computer is still independently interactive when standing at the desk
registerInteractive(computerGroup, 'computer', isMobile ? 'Use Computer' : 'E — Use Computer');

// Pre-build raycaster target list ONCE — no per-frame traversal/allocation
const SCREEN_CENTER = { x: 0, y: 0 };
let raycastTargets = [];
(function buildRaycastTargets() {
  const seen = new Set();
  for (const entry of interactiveRegistry.values()) {
    entry.mesh.traverse(o => {
      if (o.isMesh && !seen.has(o.uuid)) { seen.add(o.uuid); raycastTargets.push(o); }
    });
  }
})();

// Merge static geometry now that interactive objects are known
mergeStaticScene();

const raycaster = new THREE.Raycaster();

function updateInteractionSystem() {
  if (tweenState.active) {
    setCurrentTarget(null);
    return;
  }

  raycaster.setFromCamera(SCREEN_CENTER, camera); // no {} allocation each frame

  const hits = raycaster.intersectObjects(raycastTargets, false); // pre-built list

  if (hits.length > 0 && hits[0].distance < CFG.interactDist) {
    // Walk up parent chain to find registered entry
    let obj = hits[0].object;
    let entry = null;
    while (obj) {
      if (interactiveRegistry.has(obj.uuid)) { entry = interactiveRegistry.get(obj.uuid); break; }
      obj = obj.parent;
    }
    setCurrentTarget(entry);
  } else {
    setCurrentTarget(null);
  }
}

function setCurrentTarget(entry) {
  currentTarget = entry;
  if (entry) {
    interactionPrompt.textContent = entry.label;
    interactionPrompt.style.opacity = '1';
    btnInteract.classList.add('active');
  } else {
    interactionPrompt.style.opacity = '0';
    btnInteract.classList.remove('active');
  }
}

/* ═══════════════════════════════════════════════════════════
   SECTION 8 — State Manager & Tween
═══════════════════════════════════════════════════════════ */

// Tween system (no external dependency)
const tweenState = {
  active: false, progress: 0, duration: 1,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromYaw: 0, toYaw: 0,
  fromPitch: 0, toPitch: 0,
  onComplete: null,
};

function smoothstep(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function startCameraTween(toPos, toYaw, toPitch, duration, onComplete) {
  tweenState.active   = true;
  tweenState.progress = 0;
  tweenState.duration = duration;
  tweenState.fromPos.copy(playerRig.position);
  tweenState.toPos.copy(toPos);
  tweenState.fromYaw   = playerRig.rotation.y;
  tweenState.toYaw     = toYaw;
  tweenState.fromPitch = camera.rotation.x;
  tweenState.toPitch   = toPitch;
  tweenState.onComplete = onComplete;
}

function processTween(delta) {
  if (!tweenState.active) return;
  tweenState.progress = Math.min(1, tweenState.progress + delta / tweenState.duration);
  const t = smoothstep(tweenState.progress);
  playerRig.position.lerpVectors(tweenState.fromPos, tweenState.toPos, t);
  playerRig.rotation.y = lerpAngle(tweenState.fromYaw, tweenState.toYaw, t);
  camera.rotation.x   = lerp(tweenState.fromPitch, tweenState.toPitch, t);
  if (tweenState.progress >= 1) {
    tweenState.active = false;
    tweenState.onComplete?.();
  }
}

// ── Saved standing pose ─────────────────────────────────────
let savedStandPos = new THREE.Vector3();
let savedYaw  = 0;

// ── Chair handler ───────────────────────────────────────────
// Sitting: one unified action — sit down then auto-open the computer menu.
// Standing up is triggered by closeComputerMenu() via this same function.
let isSitting = false;

function handleChair() {
  if (tweenState.active) return;

  if (!isSitting) {
    savedStandPos.copy(playerRig.position);
    savedYaw = playerRig.rotation.y;

    isSitting = true;
    gameState = STATE.SITTING;
    handGroup.visible = false;

    // Sit at desk: player faces +Z (yaw=Math.PI) toward the monitor
    const sitPos = new THREE.Vector3(-3.7, CFG.sitHeight, 3.5);
    startCameraTween(sitPos, Math.PI, -0.08, CFG.tweenDuration, () => {
      openComputerMenu();
    });
  } else {
    // Stand back up (called from closeComputerMenu)
    isSitting = false;
    gameState = STATE.EXPLORING;
    handGroup.visible = true;
    startCameraTween(savedStandPos, savedYaw, 0, CFG.tweenDuration, () => {
      if (!isMobile) canvas.requestPointerLock();
    });
  }
}

// ── Computer handler (used when standing at the desk directly) ──
function handleComputer() {
  if (tweenState.active) return;
  openComputerMenu();
}

function openComputerMenu() {
  gameState = STATE.MENU;
  handGroup.visible = false;
  document.getElementById('computer-menu').style.display = 'flex';
  if (document.pointerLockElement) document.exitPointerLock();
  lockOverlay.style.display = 'none';
  setCurrentTarget(null);
}

function closeComputerMenu() {
  document.getElementById('computer-menu').style.display = 'none';
  setCurrentTarget(null);

  if (isSitting) {
    // Came via chair — animate standing back up
    handleChair();
  } else {
    // Came via direct computer interaction while standing
    gameState = STATE.EXPLORING;
    handGroup.visible = true;
    if (!isMobile) canvas.requestPointerLock();
  }
}

document.getElementById('btn-close-menu').addEventListener('click', closeComputerMenu);

// ── Heist targets ───────────────────────────────────────────
const HEIST_TARGETS = [
  { name: 'City Bank Vault',    difficulty: 'Hard',   reward: '$250,000', diffColor: '#ff4444' },
  { name: 'Art Museum Exhibit', difficulty: 'Medium', reward: '$85,000',  diffColor: '#ffaa22' },
  { name: 'Penthouse Jewelry',  difficulty: 'Easy',   reward: '$30,000',  diffColor: '#44ff88' },
];

document.getElementById('heist-cards').innerHTML = HEIST_TARGETS.map(t => `
  <div class="heist-card">
    <div class="card-name">${t.name}</div>
    <div class="card-diff">DIFFICULTY: <span style="color:${t.diffColor}">${t.difficulty}</span></div>
    <div class="card-reward">REWARD: <span>${t.reward}</span></div>
    <button class="btn-select" disabled>[ SELECT ]</button>
  </div>
`).join('');

// ── Flashlight toggle ───────────────────────────────────────
function toggleFlashlight() {
  flashlightOn = !flashlightOn;
  flashlight.intensity = flashlightOn ? 9 : 0;
  const btn = document.getElementById('btn-flashlight');
  btn.classList.toggle('on', flashlightOn);
}

// ── Main interact dispatcher ────────────────────────────────
function interact() {
  if (!currentTarget || currentTarget.cooldown) return;
  if (currentTarget.tag === 'chair')    handleChair();
  if (currentTarget.tag === 'computer') handleComputer();
}

/* ═══════════════════════════════════════════════════════════
   SECTION 9 — Animation Loop
═══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();
let handBobTime = 0;
let isMoving = false;

// Hand base position
const handBaseY = -0.28;
const handBaseZ = 0.05;

function processMovement(delta) {
  if (gameState !== STATE.EXPLORING || tweenState.active) return;

  const yaw  = playerRig.rotation.y;
  const fwdX = -Math.sin(yaw);
  const fwdZ = -Math.cos(yaw);
  const rgtX =  Math.cos(yaw);
  const rgtZ = -Math.sin(yaw);

  let mx = 0, mz = 0;

  // Desktop
  if (keys.has('KeyW') || keys.has('ArrowUp'))    { mx += fwdX; mz += fwdZ; }
  if (keys.has('KeyS') || keys.has('ArrowDown'))  { mx -= fwdX; mz -= fwdZ; }
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  { mx -= rgtX; mz -= rgtZ; }
  if (keys.has('KeyD') || keys.has('ArrowRight')) { mx += rgtX; mz += rgtZ; }

  // Mobile joystick
  if (joystickActive) {
    mx += fwdX * (-joystickDelta.y) + rgtX * joystickDelta.x;
    mz += fwdZ * (-joystickDelta.y) + rgtZ * joystickDelta.x;
  }

  const len = Math.sqrt(mx * mx + mz * mz);
  isMoving = len > 0.01;

  if (isMoving) {
    mx /= len; mz /= len;
    const spd = CFG.moveSpeed * delta;
    const R = 0.32; // player capsule radius
    let nx = playerRig.position.x + mx * spd;
    let nz = playerRig.position.z + mz * spd;

    // AABB collision: try sliding along X and Z axes independently
    for (const c of colliders) {
      const overlapX = nx + R > c.minX && nx - R < c.maxX;
      const overlapZ = nz + R > c.minZ && nz - R < c.maxZ;
      if (overlapX && overlapZ) {
        // Test X-only slide
        const slideX = playerRig.position.x + mx * spd;
        const canSlideX = !(slideX + R > c.minX && slideX - R < c.maxX &&
                            nz     + R > c.minZ && nz     - R < c.maxZ);
        // Test Z-only slide
        const slideZ = playerRig.position.z + mz * spd;
        const canSlideZ = !(nx     + R > c.minX && nx     - R < c.maxX &&
                            slideZ + R > c.minZ && slideZ - R < c.maxZ);
        if (canSlideX) { nz = playerRig.position.z; }
        else if (canSlideZ) { nx = playerRig.position.x; }
        else { nx = playerRig.position.x; nz = playerRig.position.z; }
      }
    }

    playerRig.position.x = clamp(nx, -4.5, 4.5);
    playerRig.position.z = clamp(nz, -4.5, 4.5);
  }
}

function updateHandBob(delta) {
  if (isMoving && gameState === STATE.EXPLORING) {
    handBobTime += delta * CFG.handBobSpeed;
  }
  handGroup.position.y  = handBaseY + Math.sin(handBobTime) * CFG.handBobAmt;
  handGroup.position.z  = -0.45 + Math.sin(handBobTime * 0.5) * 0.004;
  handGroup.rotation.z  = 0.05 + Math.sin(handBobTime * 0.5) * 0.025;
}

function animate() {
  const delta = Math.min(clock.getDelta(), 0.05);

  processMovement(delta);
  processTween(delta);

  if (gameState !== STATE.MENU) {
    updateInteractionSystem();
  }

  if (gameState === STATE.EXPLORING) {
    updateHandBob(delta);
  }

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);
