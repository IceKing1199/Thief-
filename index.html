<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Thief Simulator — Hub</title>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.158.0"
  }
}
</script>

<style>
/* ── Base ───────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }

/* ── Pointer-lock overlay ───────────────────────────────── */
#pointer-lock-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.82);
  color: #ccc; font-family: 'Courier New', monospace;
  text-align: center; gap: 18px;
  cursor: pointer;
}
#pointer-lock-overlay h1 { font-size: clamp(22px,4vw,38px); color: #00ff88; letter-spacing: 3px; }
#pointer-lock-overlay p  { font-size: clamp(13px,2vw,17px); color: #aaa; }
#pointer-lock-overlay .hint { font-size: 12px; color: #555; margin-top: 8px; }

/* ── Crosshair ──────────────────────────────────────────── */
#crosshair {
  position: fixed; top: 50%; left: 50%;
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.75);
  transform: translate(-50%, -50%);
  pointer-events: none; z-index: 10;
  box-shadow: 0 0 4px rgba(0,0,0,0.8);
}

/* ── Interaction prompt ─────────────────────────────────── */
#interaction-prompt {
  position: fixed; top: calc(50% + 24px); left: 50%;
  transform: translateX(-50%);
  color: #fff; font-family: 'Courier New', monospace; font-size: 13px;
  background: rgba(0,0,0,0.65);
  padding: 5px 14px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.15);
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none; z-index: 10;
  white-space: nowrap;
}

/* ── Computer / Heist menu ──────────────────────────────── */
#computer-menu {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0, 8, 4, 0.94);
  font-family: 'Courier New', monospace;
  color: #00ff88;
}
#computer-menu h2 {
  font-size: clamp(18px,3vw,28px); letter-spacing: 4px;
  margin-bottom: 8px; text-transform: uppercase;
}
#computer-menu .subtitle {
  font-size: 12px; color: #447755; margin-bottom: 32px;
  letter-spacing: 2px;
}
#heist-cards {
  display: flex; flex-wrap: wrap; gap: 20px;
  justify-content: center; max-width: 760px; padding: 0 16px;
}
.heist-card {
  background: rgba(0,255,136,0.04);
  border: 1px solid rgba(0,255,136,0.25);
  border-radius: 8px; padding: 20px 24px;
  width: 210px; text-align: left;
  transition: border-color 0.2s, background 0.2s;
}
.heist-card:hover {
  border-color: rgba(0,255,136,0.6);
  background: rgba(0,255,136,0.08);
}
.heist-card .card-name { font-size: 14px; margin-bottom: 10px; color: #00ff88; }
.heist-card .card-diff { font-size: 11px; color: #666; margin-bottom: 4px; }
.heist-card .card-diff span { color: #aaa; }
.heist-card .card-reward { font-size: 11px; color: #666; margin-bottom: 14px; }
.heist-card .card-reward span { color: #ffcc44; }
.btn-select {
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.3);
  color: #00ff88; font-family: inherit;
  font-size: 11px; padding: 6px 14px;
  border-radius: 3px; cursor: not-allowed;
  opacity: 0.5; letter-spacing: 1px;
}
#btn-close-menu {
  margin-top: 32px;
  background: transparent;
  border: 1px solid rgba(0,255,136,0.3);
  color: #00ff88; font-family: inherit;
  font-size: 13px; padding: 10px 32px;
  border-radius: 4px; cursor: pointer;
  letter-spacing: 2px; transition: all 0.2s;
}
#btn-close-menu:hover { background: rgba(0,255,136,0.12); }

/* ── Mobile UI ──────────────────────────────────────────── */
#mobile-ui { display: none; }

#joystick-zone {
  position: fixed; bottom: 28px; left: 28px;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.18);
  touch-action: none; z-index: 20;
}
#joystick-knob {
  position: absolute; top: 50%; left: 50%;
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.4);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

#btn-interact {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%);
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.5); font-family: 'Courier New', monospace;
  font-size: 10px; letter-spacing: 1px;
  cursor: pointer; touch-action: none;
  transition: all 0.2s; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
#btn-interact.active {
  background: rgba(0,255,136,0.18);
  border-color: rgba(0,255,136,0.7);
  color: #00ff88;
  box-shadow: 0 0 18px rgba(0,255,136,0.4);
}

#btn-flashlight {
  position: fixed; bottom: 28px; right: 28px;
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.6); font-family: 'Courier New', monospace;
  font-size: 9px; letter-spacing: 0.5px;
  cursor: pointer; touch-action: none;
  transition: all 0.2s; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
#btn-flashlight.on {
  background: rgba(200,220,255,0.18);
  border-color: rgba(200,220,255,0.7);
  color: #cce0ff;
  box-shadow: 0 0 14px rgba(150,190,255,0.5);
}
</style>
</head>

<body>

<!-- Pointer-lock start screen -->
<div id="pointer-lock-overlay">
  <h1>THIEF SIMULATOR</h1>
  <p>Click anywhere to enter the hideout</p>
  <div class="hint">WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; E — Interact &nbsp;|&nbsp; F — Flashlight</div>
</div>

<!-- HUD -->
<div id="crosshair"></div>
<div id="interaction-prompt"></div>

<!-- Heist selection menu (shown when using computer) -->
<div id="computer-menu">
  <h2>Select Target</h2>
  <div class="subtitle">// NEXT OPERATION //</div>
  <div id="heist-cards"></div>
  <button id="btn-close-menu">[ CLOSE TERMINAL ]</button>
</div>

<!-- Mobile controls -->
<div id="mobile-ui">
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>
  <button id="btn-interact">USE</button>
  <button id="btn-flashlight">LIGHT</button>
</div>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════
   SECTION 1 — Constants & Config
═══════════════════════════════════════════════════════════ */

const CFG = {
  room:         { w: 10, h: 3.5, d: 10 },
  playerHeight: 1.7,
  sitHeight:    1.05,
  moveSpeed:    3.2,
  lookSensitivity: 0.002,
  touchLookSens:   0.004,
  interactDist:    2.5,
  joystickRadius:  42,
  tweenDuration:   0.55,
  handBobSpeed:    8.0,
  handBobAmt:      0.012,
};

const STATE = { EXPLORING: 'EXPLORING', SITTING: 'SITTING', MENU: 'MENU' };

/* ═══════════════════════════════════════════════════════════
   SECTION 2 — Scene Setup
═══════════════════════════════════════════════════════════ */

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.65;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050508, 6, 18);

// Camera rig: playerRig holds position+yaw; camera holds pitch
const playerRig = new THREE.Object3D();
playerRig.position.set(0, CFG.playerHeight, 2.2);
scene.add(playerRig);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 50);
playerRig.add(camera);

// Lights
const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.18);
scene.add(ambientLight);

const ceilingLight = new THREE.PointLight(0x4a3f6b, 0.5, 9, 2);
ceilingLight.position.set(0, 3.2, 0);
scene.add(ceilingLight);

const deskLampLight = new THREE.PointLight(0xff9933, 1.4, 3.2, 2);
deskLampLight.position.set(-1.1, 1.42, -3.1);
deskLampLight.castShadow = true;
deskLampLight.shadow.mapSize.set(512, 512);
scene.add(deskLampLight);

// Flashlight (child of camera so it moves with view)
const flashlight = new THREE.SpotLight(0xccddff, 0, 14, Math.PI / 10, 0.35, 2);
flashlight.position.set(0, 0, -0.1);
flashlight.castShadow = false;
const flashlightTarget = new THREE.Object3D();
flashlightTarget.position.set(0, 0, -1);
camera.add(flashlightTarget);
flashlight.target = flashlightTarget;
camera.add(flashlight);
let flashlightOn = false;

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ═══════════════════════════════════════════════════════════
   SECTION 3 — World Builder
═══════════════════════════════════════════════════════════ */

// Material factory
function mat(color, roughness = 0.85, metalness = 0.05, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...opts });
}

function addBox(scene, w, h, d, x, y, z, material, shadow = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  if (shadow) { mesh.castShadow = true; mesh.receiveShadow = true; }
  scene.add(mesh);
  return mesh;
}

// ── Room shell ──────────────────────────────────────────────
const floorMat  = mat(0x111116, 0.95, 0.0);
const wallMat   = mat(0x0c0c18, 0.9,  0.0);
const ceilMat   = mat(0x080810, 0.95, 0.0);

// Floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Ceiling
addBox(scene, 10, 0.12, 10, 0, 3.5, 0, ceilMat, false);

// Walls
addBox(scene, 10,  3.5, 0.12,  0, 1.75, -5,   wallMat, false); // back
addBox(scene, 10,  3.5, 0.12,  0, 1.75,  5,   wallMat, false); // front
addBox(scene, 0.12, 3.5, 10,  -5, 1.75,  0,   wallMat, false); // left
addBox(scene, 0.12, 3.5, 10,   5, 1.75,  0,   wallMat, false); // right

// ── Skirting / atmosphere strips ───────────────────────────
const skirtMat = mat(0x0a0a14, 0.95, 0.1);
addBox(scene, 10, 0.12, 0.06, 0, 0.06, -4.94, skirtMat, false);
addBox(scene, 10, 0.12, 0.06, 0, 0.06,  4.94, skirtMat, false);
addBox(scene, 0.06, 0.12, 10, -4.94, 0.06, 0, skirtMat, false);
addBox(scene, 0.06, 0.12, 10,  4.94, 0.06, 0, skirtMat, false);

// ── Desk ────────────────────────────────────────────────────
const deskMat = mat(0x1e1408, 0.8, 0.05);
const deskLegMat = mat(0x111008, 0.9, 0.1);

// Surface
addBox(scene, 2.2, 0.06, 0.9, -2, 0.78, -3.55, deskMat);
// Legs
[[-1.05, -3.1], [-2.95, -3.1], [-1.05, -4.0], [-2.95, -4.0]].forEach(([x, z]) => {
  addBox(scene, 0.06, 0.78, 0.06, x, 0.39, z, deskLegMat);
});
// Shelf under desk
addBox(scene, 2.1, 0.04, 0.8, -2, 0.35, -3.55, deskMat);

// ── Chair ───────────────────────────────────────────────────
const chairMat = mat(0x0d0d0d, 0.9, 0.15);
const chairGroup = new THREE.Group();
chairGroup.name = 'chair';

function groupBox(group, w, h, d, x, y, z, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  return m;
}

// Seat
groupBox(chairGroup, 0.52, 0.06, 0.52, 0, 0, 0, chairMat);
// Back
groupBox(chairGroup, 0.52, 0.62, 0.06, 0, 0.34, -0.23, chairMat);
// Back top rail
groupBox(chairGroup, 0.52, 0.04, 0.04, 0, 0.65, -0.23, mat(0x151515, 0.8, 0.3));
// Legs
[[-0.22, 0.22], [0.22, 0.22], [-0.22, -0.22], [0.22, -0.22]].forEach(([lx, lz]) => {
  groupBox(chairGroup, 0.04, 0.48, 0.04, lx, -0.24, lz, deskLegMat);
});
// Armrests
groupBox(chairGroup, 0.04, 0.18, 0.46, -0.28, 0.18, 0, chairMat);
groupBox(chairGroup, 0.04, 0.18, 0.46,  0.28, 0.18, 0, chairMat);

chairGroup.position.set(-2, 0.48, -2.8);
scene.add(chairGroup);

// ── Computer setup ──────────────────────────────────────────
const computerGroup = new THREE.Group();
computerGroup.name = 'computer';

// Monitor base plate
groupBox(computerGroup, 0.28, 0.03, 0.18, 0, 0, 0, mat(0x111111, 0.7, 0.5));
// Monitor stand
groupBox(computerGroup, 0.035, 0.28, 0.035, 0, 0.155, -0.02, mat(0x111111, 0.6, 0.5));
// Monitor bezel
groupBox(computerGroup, 0.82, 0.52, 0.05, 0, 0.44, -0.04, mat(0x0d0d0d, 0.6, 0.3));
// Screen (emissive green tint)
const screenMat = mat(0x001a0d, 0.3, 0.0, { emissive: 0x00ff88, emissiveIntensity: 0.45 });
const screenMesh = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.44, 0.01), screenMat);
screenMesh.position.set(0, 0.44, -0.015);
computerGroup.add(screenMesh);

// PC Tower
const tower = new THREE.Group();
groupBox(tower, 0.2, 0.42, 0.36, 0, 0, 0, mat(0x111111, 0.7, 0.2));
groupBox(tower, 0.18, 0.005, 0.34, 0, 0.21, 0, mat(0x222222, 0.5, 0.4));
// Power button LED
const ledMesh = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.015, 0.005), mat(0x001100, 0.3, 0, { emissive: 0x00ff44, emissiveIntensity: 1.2 }));
ledMesh.position.set(-0.06, 0.15, 0.185);
tower.add(ledMesh);
tower.position.set(-0.58, 0.21, 0.02);
computerGroup.add(tower);

computerGroup.position.set(-2, 0.78, -3.7);
scene.add(computerGroup);

// ── Desk lamp ───────────────────────────────────────────────
const lampGroup = new THREE.Group();
const lampMat = mat(0x221800, 0.5, 0.4);
groupBox(lampGroup, 0.1, 0.03, 0.1,   0, 0, 0, lampMat);   // base
groupBox(lampGroup, 0.025, 0.42, 0.025, 0, 0.22, -0.04, lampMat); // arm
// Shade (ConeGeometry)
const shade = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.12, 8), mat(0xcc8800, 0.4, 0.3, { emissive: 0xff8800, emissiveIntensity: 0.3 }));
shade.position.set(0, 0.44, -0.06);
shade.rotation.x = 0.3;
shade.castShadow = true;
lampGroup.add(shade);
lampGroup.position.set(-1.2, 0.81, -3.28);
scene.add(lampGroup);

// ── Wall shelves (right wall) ───────────────────────────────
const shelfMat = mat(0x1a1008, 0.85, 0.05);
[1.0, 1.6, 2.2].forEach(y => {
  addBox(scene, 0.85, 0.05, 0.22, 3.6, y, -3.8, shelfMat);
  // Bracket
  addBox(scene, 0.04, y, 0.04, 3.85, y / 2, -3.8, deskLegMat);
});

// Items on shelves (simple boxes for atmosphere)
addBox(scene, 0.12, 0.18, 0.08, 3.3, 1.14, -3.8, mat(0x1a0a0a, 0.9, 0.1)); // book
addBox(scene, 0.08, 0.14, 0.08, 3.5, 1.12, -3.8, mat(0x0a1a0a, 0.9, 0.1)); // small box
addBox(scene, 0.1,  0.1,  0.1,  3.7, 1.10, -3.8, mat(0x0a0a1a, 0.7, 0.3));  // tech thing

// ── Corner clutter ──────────────────────────────────────────
addBox(scene, 0.35, 0.35, 0.35,  2.0, 0.175,  3.0, mat(0x181818, 0.95, 0.05));
addBox(scene, 0.28, 0.55, 0.28,  2.5, 0.275,  3.2, mat(0x151520, 0.9, 0.1));
addBox(scene, 0.42, 0.25, 0.38,  1.5, 0.125,  2.8, mat(0x1a1a10, 0.9, 0.0));

// Rug
const rug = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 2.5), mat(0x1a0808, 0.98, 0.0));
rug.rotation.x = -Math.PI / 2;
rug.position.set(-2, 0.002, -1.5);
rug.receiveShadow = true;
scene.add(rug);

// ── Register interactive objects ────────────────────────────
// (populated in Section 7)

/* ═══════════════════════════════════════════════════════════
   SECTION 4 — Player Hand
═══════════════════════════════════════════════════════════ */

const handGroup = new THREE.Group();
camera.add(handGroup);
handGroup.position.set(0.32, -0.28, -0.45);
handGroup.rotation.set(0.15, -0.3, 0.05);

const gloveMat = new THREE.MeshStandardMaterial({
  color: 0x0d0d0d, roughness: 0.88, metalness: 0.06,
  depthTest: false,
});

function handBox(w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), gloveMat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.renderOrder = 999;
  handGroup.add(m);
  return m;
}

// Palm / back of hand
handBox(0.10, 0.07, 0.13,  0,       0,      0);
// Fingers (slightly splayed)
handBox(0.022, 0.062, 0.022,  0.031,  0.062, -0.030);  // index
handBox(0.022, 0.068, 0.022,  0.009,  0.066, -0.032);  // middle
handBox(0.020, 0.062, 0.020, -0.012,  0.062, -0.030);  // ring
handBox(0.016, 0.050, 0.016, -0.032,  0.056, -0.026);  // pinky
// Thumb (angled)
handBox(0.022, 0.040, 0.022,  0.052,  0.012,  0.010, 0, 0, -0.5);
// Knuckle ridge
handBox(0.10, 0.016, 0.022,  0,  0.037, -0.020);
// Forearm stub (below palm)
handBox(0.09, 0.09, 0.14,  0.0, -0.11, 0.05);

// Keep hand always rendered on top
handGroup.renderOrder = 999;
handGroup.traverse(o => { if (o.isMesh) { o.material.depthTest = false; o.renderOrder = 999; } });

/* ═══════════════════════════════════════════════════════════
   SECTION 5 — Input Manager
═══════════════════════════════════════════════════════════ */

const keys = new Set();
let isPointerLocked = false;
let gameState = STATE.EXPLORING;
let prevState  = STATE.EXPLORING;

// ── Pointer Lock ────────────────────────────────────────────
const canvas = renderer.domElement;
const lockOverlay = document.getElementById('pointer-lock-overlay');

function requestLock() {
  if (gameState === STATE.MENU) return;
  canvas.requestPointerLock();
}
lockOverlay.addEventListener('click', requestLock);
canvas.addEventListener('click', () => { if (!isPointerLocked && gameState !== STATE.MENU) requestLock(); });

document.addEventListener('pointerlockchange', () => {
  isPointerLocked = document.pointerLockElement === canvas;
  lockOverlay.style.display = (isPointerLocked || gameState === STATE.MENU) ? 'none' : 'flex';
});

document.addEventListener('mousemove', e => {
  if (!isPointerLocked || gameState === STATE.MENU || tweenState.active) return;
  playerRig.rotation.y -= e.movementX * CFG.lookSensitivity;
  camera.rotation.x = clamp(camera.rotation.x - e.movementY * CFG.lookSensitivity, -Math.PI / 2.1, Math.PI / 2.1);
});

// ── Keyboard ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyE') interact();
  if (e.code === 'KeyF') toggleFlashlight();
  if (e.code === 'Escape' && gameState === STATE.MENU) closeComputerMenu();
});
document.addEventListener('keyup', e => keys.delete(e.code));

/* ═══════════════════════════════════════════════════════════
   SECTION 6 — Mobile UI
═══════════════════════════════════════════════════════════ */

const isMobile = navigator.maxTouchPoints > 1 || /Mobi|Android/i.test(navigator.userAgent);
if (isMobile) document.getElementById('mobile-ui').style.display = 'block';

// Joystick
let joystickActive  = false;
let joystickTouchId = null;
const joystickDelta = { x: 0, y: 0 };
const joystickZone  = document.getElementById('joystick-zone');
const joystickKnob  = document.getElementById('joystick-knob');

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickTouchId = t.identifier;
  joystickActive  = true;
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joystickTouchId) continue;
    const rect = joystickZone.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > CFG.joystickRadius) {
      const a = Math.atan2(dy, dx);
      dx = Math.cos(a) * CFG.joystickRadius;
      dy = Math.sin(a) * CFG.joystickRadius;
    }
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystickDelta.x = dx / CFG.joystickRadius;
    joystickDelta.y = dy / CFG.joystickRadius;
  }
}, { passive: false });

const joystickEnd = e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joystickTouchId) continue;
    joystickActive  = false;
    joystickTouchId = null;
    joystickDelta.x = 0; joystickDelta.y = 0;
    joystickKnob.style.transform = 'translate(-50%, -50%)';
  }
};
joystickZone.addEventListener('touchend',    joystickEnd, { passive: false });
joystickZone.addEventListener('touchcancel', joystickEnd, { passive: false });

// Touch-drag look (right portion of screen)
let lookTouchId  = null;
let lookLast     = { x: 0, y: 0 };

document.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (t.clientX > window.innerWidth * 0.38 && gameState !== STATE.MENU) {
      lookTouchId = t.identifier;
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: true });

document.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== lookTouchId || gameState === STATE.MENU || tweenState.active) continue;
    const dx = t.clientX - lookLast.x;
    const dy = t.clientY - lookLast.y;
    playerRig.rotation.y -= dx * CFG.touchLookSens;
    camera.rotation.x = clamp(camera.rotation.x - dy * CFG.touchLookSens, -Math.PI / 2.1, Math.PI / 2.1);
    lookLast = { x: t.clientX, y: t.clientY };
  }
}, { passive: true });

document.addEventListener('touchend',    e => { for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null; }, { passive: true });
document.addEventListener('touchcancel', e => { for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null; }, { passive: true });

// Interact / flashlight buttons
document.getElementById('btn-interact').addEventListener('touchstart', e => { e.preventDefault(); interact(); }, { passive: false });
document.getElementById('btn-flashlight').addEventListener('touchstart', e => { e.preventDefault(); toggleFlashlight(); }, { passive: false });

/* ═══════════════════════════════════════════════════════════
   SECTION 7 — Interaction System
═══════════════════════════════════════════════════════════ */

// Registry: uuid → { mesh, tag, label, cooldown }
const interactiveRegistry = new Map();
let currentTarget = null;

const interactionPrompt = document.getElementById('interaction-prompt');
const btnInteract       = document.getElementById('btn-interact');

function registerInteractive(group, tag, label) {
  // Register every descendant mesh; walk up to group when hit
  group.traverse(o => {
    if (o.isMesh) {
      interactiveRegistry.set(o.uuid, { mesh: group, tag, label, cooldown: false });
    }
  });
  // Also register the group itself as a fallback
  interactiveRegistry.set(group.uuid, { mesh: group, tag, label, cooldown: false });
}

registerInteractive(chairGroup,    'chair',    'E — Sit');
registerInteractive(computerGroup, 'computer', 'E — Use Computer');

const raycaster = new THREE.Raycaster();

function updateInteractionSystem() {
  if (tweenState.active) {
    setCurrentTarget(null);
    return;
  }

  raycaster.setFromCamera({ x: 0, y: 0 }, camera);

  // Collect meshes from interactive groups
  const candidates = [];
  for (const entry of interactiveRegistry.values()) {
    entry.mesh.traverse(o => { if (o.isMesh) candidates.push(o); });
  }
  // Deduplicate
  const unique = [...new Set(candidates)];

  const hits = raycaster.intersectObjects(unique, false);

  if (hits.length > 0 && hits[0].distance < CFG.interactDist) {
    // Walk up parent chain to find registered entry
    let obj = hits[0].object;
    let entry = null;
    while (obj) {
      if (interactiveRegistry.has(obj.uuid)) { entry = interactiveRegistry.get(obj.uuid); break; }
      obj = obj.parent;
    }
    setCurrentTarget(entry);
  } else {
    setCurrentTarget(null);
  }
}

function setCurrentTarget(entry) {
  currentTarget = entry;
  if (entry) {
    interactionPrompt.textContent = entry.label;
    interactionPrompt.style.opacity = '1';
    btnInteract.classList.add('active');
  } else {
    interactionPrompt.style.opacity = '0';
    btnInteract.classList.remove('active');
  }
}

/* ═══════════════════════════════════════════════════════════
   SECTION 8 — State Manager & Tween
═══════════════════════════════════════════════════════════ */

// Tween system (no external dependency)
const tweenState = {
  active: false, progress: 0, duration: 1,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromYaw: 0, toYaw: 0,
  fromPitch: 0, toPitch: 0,
  onComplete: null,
};

function smoothstep(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function startCameraTween(toPos, toYaw, toPitch, duration, onComplete) {
  tweenState.active   = true;
  tweenState.progress = 0;
  tweenState.duration = duration;
  tweenState.fromPos.copy(playerRig.position);
  tweenState.toPos.copy(toPos);
  tweenState.fromYaw   = playerRig.rotation.y;
  tweenState.toYaw     = toYaw;
  tweenState.fromPitch = camera.rotation.x;
  tweenState.toPitch   = toPitch;
  tweenState.onComplete = onComplete;
}

function processTween(delta) {
  if (!tweenState.active) return;
  tweenState.progress = Math.min(1, tweenState.progress + delta / tweenState.duration);
  const t = smoothstep(tweenState.progress);
  playerRig.position.lerpVectors(tweenState.fromPos, tweenState.toPos, t);
  playerRig.rotation.y = lerpAngle(tweenState.fromYaw, tweenState.toYaw, t);
  camera.rotation.x   = lerp(tweenState.fromPitch, tweenState.toPitch, t);
  if (tweenState.progress >= 1) {
    tweenState.active = false;
    tweenState.onComplete?.();
  }
}

// ── Saved standing pose ─────────────────────────────────────
const standingPos = new THREE.Vector3(0, CFG.playerHeight, 2.2);
let savedStandPos = new THREE.Vector3();
let savedYaw  = 0;

// ── Chair handler ───────────────────────────────────────────
let isSitting = false;

function handleChair() {
  if (tweenState.active) return;

  if (!isSitting) {
    // Sit down
    savedStandPos.copy(playerRig.position);
    savedYaw = playerRig.rotation.y;

    isSitting = true;
    gameState = STATE.SITTING;
    handGroup.visible = false;

    const sitPos = new THREE.Vector3(-2, CFG.sitHeight, -2.3);
    startCameraTween(sitPos, Math.PI, -0.06, CFG.tweenDuration, () => {
      // Update interaction prompt once seated
      setCurrentTarget(null);
    });
  } else {
    // Stand up
    isSitting = false;
    gameState = STATE.EXPLORING;
    handGroup.visible = true;
    startCameraTween(savedStandPos, savedYaw, 0, CFG.tweenDuration, () => {});
  }
}

// ── Computer handler ────────────────────────────────────────
function handleComputer() {
  if (tweenState.active) return;
  prevState = gameState;
  openComputerMenu();
}

function openComputerMenu() {
  gameState = STATE.MENU;
  handGroup.visible = false;
  document.getElementById('computer-menu').style.display = 'flex';
  if (document.pointerLockElement) document.exitPointerLock();
  lockOverlay.style.display = 'none';
  setCurrentTarget(null);
}

function closeComputerMenu() {
  document.getElementById('computer-menu').style.display = 'none';
  gameState = prevState;
  handGroup.visible = (gameState === STATE.EXPLORING);
  // Re-request pointer lock
  canvas.requestPointerLock();
}

document.getElementById('btn-close-menu').addEventListener('click', closeComputerMenu);

// ── Heist targets ───────────────────────────────────────────
const HEIST_TARGETS = [
  { name: 'City Bank Vault',    difficulty: 'Hard',   reward: '$250,000', diffColor: '#ff4444' },
  { name: 'Art Museum Exhibit', difficulty: 'Medium', reward: '$85,000',  diffColor: '#ffaa22' },
  { name: 'Penthouse Jewelry',  difficulty: 'Easy',   reward: '$30,000',  diffColor: '#44ff88' },
];

document.getElementById('heist-cards').innerHTML = HEIST_TARGETS.map(t => `
  <div class="heist-card">
    <div class="card-name">${t.name}</div>
    <div class="card-diff">DIFFICULTY: <span style="color:${t.diffColor}">${t.difficulty}</span></div>
    <div class="card-reward">REWARD: <span>${t.reward}</span></div>
    <button class="btn-select" disabled>[ SELECT ]</button>
  </div>
`).join('');

// ── Flashlight toggle ───────────────────────────────────────
function toggleFlashlight() {
  flashlightOn = !flashlightOn;
  flashlight.intensity = flashlightOn ? 9 : 0;
  const btn = document.getElementById('btn-flashlight');
  btn.classList.toggle('on', flashlightOn);
}

// ── Main interact dispatcher ────────────────────────────────
function interact() {
  if (!currentTarget || currentTarget.cooldown) return;
  if (currentTarget.tag === 'chair')    handleChair();
  if (currentTarget.tag === 'computer') handleComputer();
}

/* ═══════════════════════════════════════════════════════════
   SECTION 9 — Animation Loop
═══════════════════════════════════════════════════════════ */

const clock = new THREE.Clock();
let handBobTime = 0;
let isMoving = false;

// Hand base position
const handBaseY = -0.28;
const handBaseZ = 0.05;

function processMovement(delta) {
  if (gameState !== STATE.EXPLORING || tweenState.active) return;

  const yaw  = playerRig.rotation.y;
  const fwdX = -Math.sin(yaw);
  const fwdZ = -Math.cos(yaw);
  const rgtX =  Math.cos(yaw);
  const rgtZ = -Math.sin(yaw);

  let mx = 0, mz = 0;

  // Desktop
  if (keys.has('KeyW') || keys.has('ArrowUp'))    { mx += fwdX; mz += fwdZ; }
  if (keys.has('KeyS') || keys.has('ArrowDown'))  { mx -= fwdX; mz -= fwdZ; }
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  { mx -= rgtX; mz -= rgtZ; }
  if (keys.has('KeyD') || keys.has('ArrowRight')) { mx += rgtX; mz += rgtZ; }

  // Mobile joystick
  if (joystickActive) {
    mx += fwdX * (-joystickDelta.y) + rgtX * joystickDelta.x;
    mz += fwdZ * (-joystickDelta.y) + rgtZ * joystickDelta.x;
  }

  const len = Math.sqrt(mx * mx + mz * mz);
  isMoving = len > 0.01;

  if (isMoving) {
    mx /= len; mz /= len;
    const spd = CFG.moveSpeed * delta;
    const nx = playerRig.position.x + mx * spd;
    const nz = playerRig.position.z + mz * spd;
    playerRig.position.x = clamp(nx, -4.5, 4.5);
    playerRig.position.z = clamp(nz, -4.5, 4.5);
  }
}

function updateHandBob(delta) {
  if (isMoving && gameState === STATE.EXPLORING) {
    handBobTime += delta * CFG.handBobSpeed;
  }
  handGroup.position.y  = handBaseY + Math.sin(handBobTime) * CFG.handBobAmt;
  handGroup.position.z  = -0.45 + Math.sin(handBobTime * 0.5) * 0.004;
  handGroup.rotation.z  = 0.05 + Math.sin(handBobTime * 0.5) * 0.025;
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);

  processMovement(delta);
  processTween(delta);

  if (gameState !== STATE.MENU) {
    updateInteractionSystem();
  }

  if (gameState === STATE.EXPLORING) {
    updateHandBob(delta);
  }

  renderer.render(scene, camera);
}

animate();
</script>
